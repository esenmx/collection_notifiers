name: collection_notifiers
description: Reactive List, Set, Map and Queue for Flutter — mutate in place, notify only on real change. A flutter_hooks hook per type (useListNotifier) plus a ValueListenable fallback.
version: 2.3.1
repository: https://github.com/esenmx/collection_notifiers
homepage: https://mehmetesen.com
issue_tracker: https://github.com/esenmx/collection_notifiers/issues
documentation: https://pub.dev/documentation/collection_notifiers/latest/
topics:
  - collections
  - hooks
  - reactive
  - state-management
  - flutter

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3

dev_dependencies:
  checks: ^0.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
